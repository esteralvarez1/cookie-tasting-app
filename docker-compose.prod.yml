services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8000"

  # Servicio interno OpenAI-compatible que sirve el modelo local Salamandra en CPU.
  # NO se publica públicamente: solo `expose` (red interna Docker). El backend lo
  # consume en http://salamandra-api:8001/v1.
  salamandra-api:
    profiles:
      - experimental
    build:
      context: ./salamandra-api
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      SALAMANDRA_MODEL_PATH: /models/salamandra-2b-instruct
      SALAMANDRA_API_KEY: ${SALAMANDRA_API_KEY}
      SALAMANDRA_MAX_NEW_TOKENS: 700
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      # Modelo descargado previamente en la VM (solo lectura). Ver scripts/download_salamandra.sh
      - /opt/sensia/models/salamandra-2b-instruct:/models/salamandra-2b-instruct:ro
    expose:
      - "8001"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${PUBLIC_APP_URL}
        VITE_ADMIN_HEADER_NAME: X-Admin-Key
    restart: unless-stopped
    expose:
      - "80"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
